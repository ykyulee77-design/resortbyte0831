<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="512" fill="url(#bgGradient)"/>
  
  <!-- Central Mountain Resort -->
  <path d="M300 650 L450 350 L600 500 L750 250 L900 400 L950 350 L950 750 L300 750 Z" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Job Connection Lines -->
  <path d="M200 400 Q400 300 600 400" stroke="#FBBF24" stroke-width="8" fill="none" opacity="0.8"/>
  <path d="M600 400 Q800 300 1000 400" stroke="#FBBF24" stroke-width="8" fill="none" opacity="0.8"/>
  
  <!-- Job Seeker Icon (Left) -->
  <circle cx="200" cy="400" r="40" fill="#10B981"/>
  <path d="M200 360 L200 320 M200 480 L200 440 M160 400 L120 400 M240 400 L280 400" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Resort Icon (Right) -->
  <rect x="960" y="360" width="80" height="80" rx="10" fill="#10B981"/>
  <rect x="980" y="340" width="40" height="20" rx="5" fill="#10B981"/>
  <rect x="990" y="380" width="10" height="20" fill="#FFFFFF"/>
  <rect x="1010" y="380" width="10" height="20" fill="#FFFFFF"/>
  <rect x="990" y="410" width="10" height="20" fill="#FFFFFF"/>
  <rect x="1010" y="410" width="10" height="20" fill="#FFFFFF"/>
  
  <!-- Matching Symbol in Center -->
  <circle cx="512" cy="400" r="60" fill="#FBBF24"/>
  <path d="M480 400 L500 420 L540 380" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Waves at Bottom -->
  <path d="M100 800 Q200 750 300 800 T500 800 T700 800 T900 800 T1100 800 L1100 1024 L100 1024 Z" fill="#0F766E" opacity="0.3"/>
  
  <!-- App Name -->
  <text x="512" y="900" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#FFFFFF">ResortByte</text>
</svg>
